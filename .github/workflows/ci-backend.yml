name: Backend checks

on:
  push:
    branches: [main, master]
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/ci-backend.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'infra/**'
      - '.github/workflows/ci-backend.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://seismoscope:ci-only@localhost:5432/seismoscope
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: python -m compileall -q backend/src backend/tests
      - run: python -m pip install ./backend
      - run: python -m unittest discover -s backend/tests -v
      - run: SEISMOSCOPE_ENV_FILE=.env.example docker compose --env-file infra/.env.example -f infra/docker-compose.yml config --quiet
      - run: bash -n infra/deploy.sh
