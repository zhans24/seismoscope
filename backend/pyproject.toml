[project]
name = "seismoscope"
version = "0.1.0"
description = "Backend for seismic event collection and analysis"
authors = [
    { name = "zhans24", email = "zhasikgaziz@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2",
    "asyncpg>=0.30,<1",
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy[asyncio]>=2.0,<3",
    "uvicorn[standard]>=0.32,<1",
]

[project.scripts]
seismoscope = "seismoscope.main:run"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
