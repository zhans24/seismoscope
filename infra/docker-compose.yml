services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ${SEISMOSCOPE_ENV_FILE:-.env}
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ../backend
    command: ["uvicorn", "seismoscope.main:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file: ${SEISMOSCOPE_ENV_FILE:-.env}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - waveform_data:/data/waveforms
    restart: unless-stopped

  worker:
    build: ../backend
    command: ["python", "-m", "seismoscope.worker"]
    env_file: ${SEISMOSCOPE_ENV_FILE:-.env}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - waveform_data:/data/waveforms
    restart: unless-stopped

  frontend:
    build:
      context: ../frontend
    ports:
      - "5173:5173"
    depends_on:
      - api
    volumes:
      - ../frontend:/app
      - frontend_node_modules:/app/node_modules
    restart: unless-stopped

volumes:
  postgres_data:
  waveform_data:
  frontend_node_modules:
